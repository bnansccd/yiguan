{% extends "base.html" %}
{% block title %}登录 - 昭德堂健康管理中心业务系统{% endblock %}
{% block auth_content %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-heart-pulse text-success" style="font-size:3rem"></i>
            <h4 class="mt-2">昭德堂健康管理</h4>
            <p class="text-muted">业务系统</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">验证码</label>
                <div class="d-flex align-items-center gap-2">
                    <input type="text" name="captcha" class="form-control" placeholder="请输入验证码"
                           maxlength="4" autocomplete="off" required style="max-width:160px">
                    <img id="captchaImg" src="/captcha" alt="验证码" style="height:40px;cursor:pointer;border:1px solid #ddd;border-radius:4px"
                         title="点击刷新验证码">
                </div>
                <small class="text-muted">点击图片可刷新验证码</small>
            </div>
            <button type="submit" class="btn btn-success w-100">登 录</button>
        </form>
    </div>
</div>
<script>
    document.getElementById('captchaImg').addEventListener('click', function(){
        this.src = '/captcha?t=' + Date.now();
    });
</script>
{% endblock %}
